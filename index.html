<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нежная палитра</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body {
            background: linear-gradient(135deg, #f5f0f8, #e8e0f0, #d8d0e8);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            color: #333; padding: 20px;
        }
        .container {
            text-align: center; padding: 25px;
            background: white; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(150, 130, 200, 0.2);
            max-width: 450px; width: 100%;
        }
        h1 {
            font-size: 24px; margin-bottom: 20px;
            color: #7b6ca8;
        }
        .preview {
            width: 100%; height: 80px; border-radius: 15px;
            margin-bottom: 20px; border: 3px solid #e0d8f0;
            background: #f0e8f8; transition: background 0.3s ease;
        }
        .palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .color-box {
            width: 100%; aspect-ratio: 1; border-radius: 12px;
            cursor: pointer; border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .color-box:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .color-box:active {
            transform: scale(0.95);
        }
        .info {
            background: #f8f5fc; padding: 15px;
            border-radius: 12px; margin-bottom: 15px;
        }
        .info-row {
            display: flex; justify-content: space-between;
            margin-bottom: 8px; font-size: 15px; color: #7b6ca8;
        }
        .info-row:last-child { margin-bottom: 0; }
        .info-row span {
            font-weight: bold; color: #5a4a88;
        }
        .copy-btn {
            width: 100%; padding: 12px; font-size: 16px;
            font-weight: bold; border: none; border-radius: 12px;
            cursor: pointer; color: white;
            background: linear-gradient(90deg, #b8a8e8, #d8c8f0);
            box-shadow: 0 5px 15px rgba(150, 130, 200, 0.3);
            transition: all 0.3s ease;
        }
        .copy-btn:hover { transform: scale(1.03); }
        .copy-btn.copied {
            background: linear-gradient(90deg, #a8e8b8, #c8f0d8);
        }
        .footer {
            margin-top: 20px; font-size: 12px; color: #b0a8c8;
        }
        .footer a { color: #b8a8e8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 НЕЖНАЯ ПАЛИТРА</h1>

        <div class="preview" id="preview"></div>

        <div class="palette" id="palette"></div>

        <div class="info">
            <div class="info-row">HEX: <span id="hexCode">#F0E8F8</span></div>
            <div class="info-row">RGB: <span id="rgbCode">240, 232, 248</span></div>
        </div>

        <button class="copy-btn" onclick="copyCode(this)">📋 КОПИРОВАТЬ ЦВЕТ</button>

        <div class="footer">
            Создано <a href="https://github.com/svnflwer" target="_blank">Svnflwer</a>
        </div>
    </div>

    <script>
        // НЕЖНЫЕ (ПАСТЕЛЬНЫЕ) ЦВЕТА
        const colors = [
            "#FADADD", "#F8C8DC", "#F4B8C8", "#E8A8C8", "#D898B8",
            "#FDE2C8", "#FCD8B0", "#F8C8A0", "#F0B888", "#E8A878",
            "#FFF8D8", "#FFF0B8", "#F8E898", "#F0D878", "#E8C868",
            "#E0F8D8", "#C8F0C0", "#B0E8A8", "#98D890", "#80C878",
            "#D8F0F8", "#C0E8F8", "#A8D8F0", "#90C8E8", "#78B8D8",
            "#D8E0F8", "#C0C8F0", "#A8B0E8", "#90A0D8", "#7890C8",
            "#E8D8F8", "#D8C0F0", "#C8A8E8", "#B890D8", "#A878C8",
            "#F8D8F0", "#F0C0E8", "#E8A8D8", "#D890C8", "#C878B8"
        ];

        const palette = document.getElementById('palette');
        const preview = document.getElementById('preview');
        const hexCode = document.getElementById('hexCode');
        const rgbCode = document.getElementById('rgbCode');

        let currentColor = "#F0E8F8";

        // СОЗДАЁМ КВАДРАТИКИ
        colors.forEach(color => {
            const box = document.createElement('div');
            box.className = 'color-box';
            box.style.background = color;
            box.onclick = () => selectColor(color);
            palette.appendChild(box);
        });

        function selectColor(color) {
            currentColor = color;
            preview.style.background = color;
            hexCode.textContent = color.toUpperCase();

            const r = parseInt(color.slice(1, 3), 16);
            const g = parseInt(color.slice(3, 5), 16);
            const b = parseInt(color.slice(5, 7), 16);
            rgbCode.textContent = `${r}, ${g}, ${b}`;
        }

        function copyCode(btn) {
            const text = currentColor.toUpperCase();
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = "✅ СКОПИРОВАНО";
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = "📋 КОПИРОВАТЬ ЦВЕТ";
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        // ПЕРВЫЙ ЦВЕТ
        selectColor(currentColor);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Палитра Цветов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            color: white; padding: 20px;
        }
        .container {
            text-align: center; padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px; border: 2px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 0 40px rgba(100, 150, 255, 0.2);
            max-width: 400px; width: 100%; animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 {
            font-size: 26px; margin-bottom: 20px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .color-preview {
            width: 100%; height: 150px; border-radius: 15px;
            margin-bottom: 20px; border: 3px solid rgba(255,255,255,0.2);
            background: #ff0000; transition: background 0.3s ease;
        }
        input[type="color"] {
            width: 100%; height: 60px; border: none; border-radius: 12px;
            cursor: pointer; background: transparent; margin-bottom: 15px;
        }
        .code-box {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0, 0, 0, 0.4); padding: 12px 15px;
            border-radius: 10px; margin-bottom: 10px;
            font-size: 18px; font-weight: bold; letter-spacing: 1px;
        }
        .code-box span { color: #00d4ff; }
        .copy-btn {
            padding: 8px 15px; font-size: 14px; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer;
            background: linear-gradient(90deg, #00c853, #00e676);
            color: white; transition: all 0.3s ease;
        }
        .copy-btn:hover { transform: scale(1.05); }
        .copy-btn.copied {
            background: linear-gradient(90deg, #ff9800, #ffb74d);
        }
        .random-btn {
            width: 100%; padding: 15px; font-size: 17px; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer;
            background: linear-gradient(90deg, #7b2ff7, #00d4ff);
            color: white; box-shadow: 0 0 20px rgba(123, 47, 247, 0.5);
            transition: all 0.3s ease;
        }
        .random-btn:hover { transform: scale(1.04); }
        .footer {
            margin-top: 20px; font-size: 12px; color: #666;
        }
        .footer a { color: #00d4ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 ПАЛИТРА ЦВЕТОВ</h1>

        <div class="color-preview" id="preview"></div>

        <input type="color" id="colorPicker" value="#ff0000" onchange="updateColor()">

        <div class="code-box">
            HEX: <span id="hexCode">#FF0000</span>
            <button class="copy-btn" onclick="copyCode('hexCode', this)">Копировать</button>
        </div>

        <div class="code-box">
            RGB: <span id="rgbCode">255, 0, 0</span>
            <button class="copy-btn" onclick="copyCode('rgbCode', this)">Копировать</button>
        </div>

        <button class="random-btn" onclick="randomColor()">🎲 СЛУЧАЙНЫЙ ЦВЕТ</button>

        <div class="footer">
            Создано <a href="https://github.com/svnflwer" target="_blank">Svnflwer</a>
        </div>
    </div>

    <script>
        const picker = document.getElementById('colorPicker');
        const preview = document.getElementById('preview');
        const hexCode = document.getElementById('hexCode');
        const rgbCode = document.getElementById('rgbCode');

        function updateColor() {
            const hex = picker.value.toUpperCase();
            preview.style.background = hex;
            hexCode.textContent = hex;

            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            rgbCode.textContent = `${r}, ${g}, ${b}`;
        }

        function copyCode(id, btn) {
            const text = document.getElementById(id).textContent;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = "✅ Готово";
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = "Копировать";
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        function randomColor() {
            const random = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
            picker.value = random;
            updateColor();
        }

        updateColor();
    </script>
</body>
</html>
